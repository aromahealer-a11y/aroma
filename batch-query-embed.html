<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批次文件查詢</title>
<!--
  批次文件查詢 widget
  ---------------------------------------------------------------
  用法（商品頁以 iframe 內嵌）：
    <iframe src="…/batch-query-embed.html?code=FLV003" width="100%" height="300" style="border:0"></iframe>

  網址參數：
    code=FLV003        商品代碼（必要；未帶則嘗試從 referrer 猜，再不行顯示提示）
    only=analysis      只顯示分析報告／GC 那張卡（商品頁已自行列出 MSDS、TDS 時用）
    mode=card          卡片模式：去掉標題與外框，只留「小標＋下拉＋開啟 PDF」，
                       讓商品頁可以把它當成一張卡跟 MSDS／TDS 並排（自動含 only=analysis）
    msds=檔名.pdf      例外檔名（檔名非標準規則時才需要）
    tds=檔名.pdf       同上

  批次清單來自同目錄的 batches.json，由 .github/workflows/update-batches.yml
  自動抓取原廠頁面更新。三種狀態：
    有批次           → 下拉選單（近 3 年，至少留最新 3 批），另留一行小字可切手動輸入
    讀不到／未同步   → 退回手動輸入批號
    原廠一份都沒掛   → 顯示「本產品目前無逐批分析文件」，不出現輸入框
                      （原廠日後補上，同步後自動變回下拉選單，商品頁不必再改）
-->
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; padding:20px 14px; color:#1e293b; line-height:1.6;
        font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',Arial,sans-serif;
        -webkit-font-smoothing:antialiased; background:transparent; }
  .wrap{ max-width:900px; margin:0 auto; }
  .lead{ margin:0 0 6px; font-size:15px; color:#1e293b; }
  .sub{ margin:0 0 16px; font-size:13px; color:#64748b; }

  .row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .row select,.row input{ flex:1 1 220px; min-width:0; padding:11px 12px; font-size:14px;
        border:1px solid rgba(15,23,42,.22); border-radius:2px; background:#fff; color:#1e293b; }
  .row input{ font-family:ui-monospace,Menlo,Consolas,monospace; text-transform:uppercase; letter-spacing:.06em; }
  .row select:focus,.row input:focus{ outline:none; border-color:#1b305c; }
  .row button{ flex:0 0 auto; padding:0 22px; border:0; border-radius:2px; cursor:pointer;
        background:#1b305c; color:#fff; font-size:14px; font-weight:700; letter-spacing:.04em; }
  .hint{ margin:-8px 0 18px; font-size:12px; color:#94a3b8; }
  /* 原廠尚未提供任何批次文件時的靜態說明：不是錯誤訊息，語氣要正常一點 */
  .hint.note{ margin:0; font-size:14px; color:#475569; line-height:1.9; }
  /* 後路：平常只是一行小字，點了才展開輸入框 */
  .fallback{ margin:-10px 0 16px; font-size:12px; }
  .fallback a{ color:#94a3b8; text-decoration:none; border-bottom:1px solid rgba(148,163,184,.5); }
  .fallback a:hover{ color:#1b305c; border-bottom-color:#1b305c; }

  .docs{ display:flex; flex-direction:column; gap:10px; }
  .doc{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; padding:16px 18px;
        text-decoration:none; color:inherit; background:#f8fafc;
        border:1px solid rgba(15,23,42,.07); border-top:3px solid #1b305c; }
  .doc:hover{ background:#f1f5f9; }
  .doc .badge{ flex:0 0 auto; color:#94a3b8; font-size:12px; font-weight:700;
        letter-spacing:.35em; text-transform:uppercase; }
  .doc .ttl{ flex:0 0 auto; color:#1e293b; font-size:15px; font-weight:500; }
  .doc .desc{ flex:1 1 240px; color:#475569; font-size:13px; }
  .doc .arrow{ flex:0 0 auto; color:#1b305c; font-size:14px; font-weight:700; }
  .doc.off{ opacity:.45; pointer-events:none; }
  .empty{ display:none; padding:18px 6px; font-size:14px; color:#94a3b8; line-height:1.9; text-align:center; }

  /* 卡片模式：外框、小標、說明文案都由商品頁那一格負責，這裡只留下拉與連結 */
  body.card{ padding:0; }
  body.card .wrap{ max-width:none; }
  body.card .lead,body.card .sub{ display:none; }
  body.card .row{ margin-bottom:16px; }
  /* 卡片模式：欄位不吃滿整行。批號最長是 FLE001-AZ170226NC（17 字元）約 133px，
     加上左右 padding 與下拉箭頭約 180px，220px 有餘裕又不會空得誇張。
     注意：只改寬度不改高度——商品頁那層是用固定 height＋overflow:hidden 裁切的，
     欄位一變矮，widget 內容整體就變矮，連結會離卡片底部太遠、跟另外兩張卡對不齊。 */
  body.card .row select,body.card .row input{ flex:1 1 100%; max-width:220px; }
  /* 卡片模式沒有「查詢」按鈕：輸入框吃滿整行，按鈕只能換行，硬是多吃 30px 高度，
     iframe 又是固定高，多出來的部分會無聲蓋掉最底下的「開啟 PDF」。改成邊打邊套用。 */
  body.card .row button{ display:none; }
  body.card .doc{ display:inline-flex; padding:0; gap:0; background:none; border:0; }
  body.card .doc:hover{ background:none; }
  body.card .doc .badge,body.card .doc .ttl,body.card .doc .desc{ display:none; }
  body.card .doc .arrow{ padding-bottom:2px; border-bottom:2px solid #1b305c;
        font-size:15px; font-weight:700; letter-spacing:.04em; }
  body.card .doc.off{ opacity:.35; }
  body.card .hint{ margin:-8px 0 14px; }
  body.card .hint.note{ margin:0; }

/* 2026-10-16: readable standard widget; compact card mode retains its layout. */
[hidden]{display:none!important}
body:not(.card){padding:0;color:#303840;background:transparent}
body:not(.card) .wrap{max-width:none;margin:0}
body:not(.card) .lead{margin:0 0 6px;font-size:17px;font-weight:500;line-height:1.6;color:#303840}
body:not(.card) .sub{margin:0 0 16px;font-size:14px;line-height:1.8;color:#4F5B66}
body:not(.card) .row{gap:10px;margin:0 0 8px}
body:not(.card) .row select,body:not(.card) .row input{flex:0 1 420px;width:100%;max-width:420px;min-height:48px;border:1px solid #AAB3BF;border-radius:2px;padding:11px 12px;font-family:inherit;font-size:15px;line-height:24px;color:#303840;background:#fff}
body:not(.card) .row button{min-height:48px;padding:0 20px;background:#495990;font-family:inherit;font-size:15px;font-weight:500;letter-spacing:.02em}
body:not(.card) .fallback{margin:0 0 12px;font-size:14px;line-height:1.7}
body:not(.card) .fallback a{display:inline-flex;align-items:center;min-height:44px;color:#495990;text-decoration:underline;text-underline-offset:4px;border:0}
body:not(.card) .fallback a:hover{color:#1A1A1A;text-decoration-thickness:2px}
body:not(.card) .hint{margin:0 0 12px;font-size:14px;line-height:1.8;color:#4F5B66}
body:not(.card) .hint.note{margin:0 0 12px}
/* Horizontal document buttons, following the supplied Florihana reference. */
body:not(.card) .docs{display:flex;flex-direction:row;align-items:stretch;gap:16px;border:0}
body:not(.card) .doc{position:relative;display:flex;flex:1 1 0;min-width:0;flex-wrap:nowrap;align-items:center;gap:8px;min-height:56px;padding:16px 20px;border:0;border-radius:28px;background:#F6F5F3;color:#1A1A1A;text-decoration:none}
body:not(.card) .doc:hover{background:#ECEAE6}
body:not(.card) .doc .badge,body:not(.card) .doc .ttl{flex:0 0 auto;margin:0;color:inherit;font-size:15px;font-weight:500;line-height:24px;letter-spacing:.01em}
body:not(.card) .doc .desc{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
body:not(.card) .doc .arrow{display:inline-flex;flex:0 0 24px;align-items:center;justify-content:center;width:24px;height:24px;margin-left:auto;color:inherit}
body:not(.card) .doc .download-icon{display:block;width:24px;height:24px}
body:not(.card) .doc.off{opacity:1;pointer-events:none;color:#8A8580}
body:not(.card) .doc.off .arrow{visibility:visible}
body:not(.card) .empty{padding:12px 0;color:#4F5B66;font-size:14px;line-height:1.8;text-align:left}
a:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid #495990;outline-offset:3px}
@media(max-width:660px){
 body:not(.card) .row select,body:not(.card) .row input{flex:1 1 180px;max-width:none}
 body:not(.card) .docs{flex-direction:column;gap:12px}
 body:not(.card) .doc{flex:none;width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="sub" id="sub">請查看瓶身批號，查閱對應文件。</p>

  <div class="row" id="row">
    <select id="sel" aria-label="選擇瓶身批號"><option value="">選擇批號</option></select>
    <input id="b" aria-label="輸入瓶身批號" type="text" placeholder="例如 190626TR" hidden>
    <button id="go" hidden>查詢</button>
  </div>
  <p class="hint" id="hint" hidden></p>
  <p class="fallback" id="fallback" hidden><a href="#" id="fallbackLink">其他批號，請改用輸入</a></p>

  <div class="docs" id="docs">
    <a class="doc off" id="lGc" target="_blank" rel="noopener">
      <span class="badge">GC/MS</span><span class="ttl">氣相分析</span>
      <span class="desc">查看該批次的成分比例與分析資料。</span>
      <span class="arrow"><svg class="download-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2.5v13m-4.5-4.5 4.5 4.5 4.5-4.5M3 17.5c0 3.2 2.7 4.5 9 4.5s9-1.3 9-4.5"/></svg></span>
    </a>
    <a class="doc" id="lMs" target="_blank" rel="noopener">
      <span class="badge">MSDS</span><span class="ttl">安全資料</span>
      <span class="desc">查看儲存、運輸與使用的安全資訊。</span>
      <span class="arrow"><svg class="download-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2.5v13m-4.5-4.5 4.5 4.5 4.5-4.5M3 17.5c0 3.2 2.7 4.5 9 4.5s9-1.3 9-4.5"/></svg></span>
    </a>
    <a class="doc" id="lTd" target="_blank" rel="noopener">
      <span class="badge">TDS</span><span class="ttl">技術規格</span>
      <span class="desc">查看產品規格與物性資料。</span>
      <span class="arrow"><svg class="download-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2.5v13m-4.5-4.5 4.5 4.5 4.5-4.5M3 17.5c0 3.2 2.7 4.5 9 4.5s9-1.3 9-4.5"/></svg></span>
    </a>
  </div>

  <p class="empty" id="empty">請從商品頁開啟批次文件查詢。</p>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search);

  function detectCode(){
    const q = P.get('code');
    if (q) return q.toUpperCase();
    const m = (document.referrer || '').match(/FL[A-Z]+\d+/i);
    return m ? m[0].toUpperCase() : '';
  }

  const CODE       = detectCode();
  const CARD       = (P.get('mode') || '') === 'card';
  const ONLY_AN    = CARD || (P.get('only') || '') === 'analysis';
  const BASE       = 'https://www.florihana.com/en/module/axproductattachments/export';
  // 蒸餾液 FLH／植物油 FLV／浸泡油 FLM／植物脂 FLBE＝分析報告，其餘（精油、CO2 萃取）＝GC 圖譜
  const IS_ANALYSE = /^FL(?:BE|[HVM])/.test(CODE);
  const GC_TYPE    = IS_ANALYSE ? 'Analyse' : 'Chromatographies';

  let MSDS_FILE = P.get('msds') || '';
  let TDS_FILE  = P.get('tds')  || '';

  function urls(batch){
    const c = encodeURIComponent(CODE);
    return {
      gc: `${BASE}?type=${encodeURIComponent(GC_TYPE)}&file=${encodeURIComponent(CODE + batch + '.pdf')}&reference=${c}`,
      ms: `${BASE}?type=${encodeURIComponent('Fiche de sécurité')}&file=${encodeURIComponent(MSDS_FILE || CODE + '.pdf')}&reference=${c}`,
      td: `${BASE}?type=${encodeURIComponent('Fiche technique')}&file=${encodeURIComponent(TDS_FILE  || CODE + 'FT.pdf')}&reference=${c}`
    };
  }

  /**
   * 下拉只列近 KEEP_YEARS 年的批次；周轉慢的品項（例如近年都沒出新批的精油）
   * 至少保留最新 KEEP_MIN 批，免得清單變空。batches.json 仍保留完整歷史，
   * 更舊的批號可用「改用輸入的」手動查。
   * 批號含 DDMMYY（190626TR、AZ170226NC 皆同），轉成 YYMMDD 比大小；
   * list 由 fetch-batches.mjs 排好新→舊。
   */
  const KEEP_YEARS = 3;
  const KEEP_MIN   = 3;

  function recent(list){
    const ymd = b => {
      const m = /(\d{2})(\d{2})(\d{2})/.exec(b);
      return m ? m[3] + m[2] + m[1] : '000000';
    };
    const d = new Date();
    const cut = String(d.getFullYear() - KEEP_YEARS).slice(-2)
              + String(d.getMonth() + 1).padStart(2, '0')
              + String(d.getDate()).padStart(2, '0');
    const kept = list.filter(b => ymd(b) >= cut);
    return kept.length >= KEEP_MIN ? kept : list.slice(0, KEEP_MIN);
  }

  /** 下拉顯示＝商品代碼－批號，例：FLH002-220626F、FLE001-AZ170226NC */
  function label(batch){
    return CODE ? `${CODE}-${batch}` : batch;
  }

  function apply(batch){
    const u = urls(batch);
    $('lMs').href = u.ms;
    $('lTd').href = u.td;
    if (batch){
      $('lGc').href = u.gc;
      $('lGc').classList.remove('off');
    } else {
      $('lGc').removeAttribute('href');
      $('lGc').classList.add('off');
    }
  }

  /**
   * 商品有登錄、但原廠一份批次文件都沒掛（analyse 與 gc 皆為空）。
   * 這種商品沒有批號可輸入，叫客人輸入只會開到不存在的 PDF，
   * 所以收掉輸入區與分析報告卡，改成一句靜態說明。
   * 原廠日後補上文件，同步後就會自動變回下拉選單，商品頁不必再改。
   */
  function noBatches(){
    $('row').style.display = 'none';
    $('fallback').hidden = true;
    $('lGc').style.display = 'none';
    $('sub').textContent = '目前無逐批分析文件。';
    $('hint').textContent = '原廠尚未提供逐批文件，請參閱技術規格（TDS）。';
    $('hint').className = 'hint note';
    $('hint').hidden = false;
  }

  /**
   * 手動輸入 ⇄ 清單選擇是雙向的。以前 enableManual 會把「改用輸入的」那行一起藏掉，
   * 切過去就沒有任何回頭的入口，只能重整網頁。現在那行小字改成切換鈕：
   * 清單模式顯示「其他批號，請改用輸入」，手動模式顯示「改用清單選擇」，
   * 兩種模式各佔一行，iframe 固定高度下版面不會跳、也不會擠掉底下的「開啟 PDF」。
   *
   * hasList=false：清單根本沒載到（未同步／載入失敗），沒有清單可回，只留一行提示。
   */
  let manualBound = false;

  function enableManual(msg, hasList){
    $('sel').hidden = true;
    $('b').hidden   = false;
    $('go').hidden  = false;
    $('sub').textContent = '輸入瓶身批號，查閱對應文件。';

    $('hint').textContent = msg || '';
    $('hint').className   = 'hint';
    $('hint').hidden      = !msg;

    if (hasList){
      $('fallbackLink').textContent = '改用清單選擇';
      $('fallbackLink').onclick = e => { e.preventDefault(); enableList(); };
      $('fallback').hidden = false;
    } else {
      $('fallback').hidden = true;
    }

    if (!manualBound){
      manualBound = true;
      // 不回寫 input.value：欄位已有 text-transform:uppercase 負責顯示，
      // 每次按鍵都改寫 value 會把游標彈到尾端。
      // 批號實測 7 到 9 碼，打到 6 碼才讓連結亮起來，免得打到一半誤點開不存在的 PDF。
      const run = () => {
        const v = $('b').value.trim().toUpperCase();
        apply(v.length >= 6 ? v : '');
      };
      $('go').onclick = run;
      $('b').addEventListener('input', run);
      $('b').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
    }
    $('b').dispatchEvent(new Event('input'));
  }

  function enableList(){
    $('b').hidden    = true;
    $('go').hidden   = true;
    $('sel').hidden  = false;
    $('hint').hidden = true;
    $('sub').textContent = '請查看瓶身批號，查閱對應文件。';
    $('fallbackLink').textContent = '其他批號，請改用輸入';
    $('fallbackLink').onclick = e => { e.preventDefault(); enableManual('', true); };
    $('fallback').hidden = false;
    apply($('sel').value);
  }

  if (!CODE){
    $('row').style.display = 'none';
    $('docs').style.display = 'none';
    $('sub').style.display = 'none';
    $('empty').style.display = 'block';
    return;
  }

  // 分析報告系列：第一張卡改標題
  if (IS_ANALYSE){
    $('lGc').querySelector('.badge').textContent = 'Analysis';
    $('lGc').querySelector('.ttl').textContent   = '分析報告';
    $('lGc').querySelector('.desc').textContent  = '查看該批次的原廠檢測資料。';
  }
  // only=analysis：商品頁已自行列出 MSDS／TDS 時，這裡只留分析報告
  if (ONLY_AN){
    $('lMs').style.display = 'none';
    $('lTd').style.display = 'none';
  }

  // 卡片模式：只留「下拉選單＋開啟 PDF」，小標與說明文案由商品頁那一格自己寫，
  // 這樣三張卡的文字風格由商品頁統一掌握，widget 不再插手文案。
  if (CARD){
    document.body.classList.add('card');
    // 箭頭後面補 \uFE0E（VARIATION SELECTOR-15）：U+2197 在 Unicode 被標記為 emoji，
    // 手機字型 fallback 會抓 Apple Color Emoji／Noto Color Emoji 畫成彩色圖，補這個字才會維持單色文字箭頭。
    $('lGc').querySelector('.arrow').textContent = '開啟 PDF \u2197\uFE0E';
  }

  apply('');   // 先讓 MSDS／TDS 可點

  fetch('batches.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('batches.json 讀取失敗')))
    .then(data => {
      const p = (data.products || {})[CODE];
      const list = p ? (IS_ANALYSE ? p.analyse : p.gc) || [] : [];
      if (p){
        if (p.msds && !MSDS_FILE) MSDS_FILE = p.msds;
        if (p.tds  && !TDS_FILE)  TDS_FILE  = p.tds;
        apply('');
      }
      if (!list.length){
        // 已登錄但原廠兩種批次文件都沒有 → 靜態說明；只是還沒同步到 → 退回手動輸入
        const none = p && !(p.analyse || []).length && !(p.gc || []).length;
        // 提示文字要壓在一行內：卡片模式 iframe 是固定高，折成兩行就會擠掉底下的「開啟 PDF」
        if (none) noBatches();
        else enableManual('尚無批次清單，請輸入批號。', false);
        return;
      }

      const sel = $('sel');
      for (const b of recent(list)){
        const o = document.createElement('option');
        o.value = b; o.textContent = label(b);
        sel.appendChild(o);
      }
      sel.onchange = () => apply(sel.value);

      // 清單正常時，下方留一行小字當後路（例如剛進的新批號還沒同步），可雙向切換
      enableList();
    })
    .catch(() => enableManual('清單暫時無法載入，請輸入批號。', false));
})();
</script>

<script id="ah-batch-query-resize-20261016">
(function(){
  'use strict';
  if(window.parent===window||new URLSearchParams(location.search).get('mode')==='card')return;
  var wrap=document.querySelector('.wrap'),last=0,queued=false;
  if(!wrap)return;
  function report(){
    queued=false;
    var s=getComputedStyle(document.body);
    var h=Math.ceil(wrap.getBoundingClientRect().height+parseFloat(s.paddingTop||0)+parseFloat(s.paddingBottom||0));
    if(h===last||h<1)return;
    last=h;
    window.parent.postMessage({type:'ah-batch-query-height',height:h},'*');
  }
  function schedule(){if(!queued){queued=true;requestAnimationFrame(report);}}
  if(typeof ResizeObserver==='function')new ResizeObserver(schedule).observe(wrap);
  new MutationObserver(schedule).observe(wrap,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['hidden','class','style']});
  window.addEventListener('resize',schedule);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
  schedule();
})();
</script>
